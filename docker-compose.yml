# Ambiente local com a mesma imagem de produção. Em produção o MySQL é um
# serviço separado no Easypanel e este arquivo não é usado.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file: .env
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      RUN_MIGRATIONS: "true"
    volumes:
      - app_storage:/app/storage/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # 3306 já é usada pelo MySQL do XAMPP
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  app_storage:
  db_data:
