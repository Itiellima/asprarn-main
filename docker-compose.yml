# Ambiente local com a mesma imagem de produção. Em produção o MySQL e o
# SeaweedFS são serviços separados no Easypanel e este arquivo não é usado.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file: .env
    environment:
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      RUN_MIGRATIONS: "true"
      AWS_ENDPOINT: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET_DOCUMENTOS: documentos
      AWS_BUCKET_MIDIA: midia
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  # S3 local (sem autenticação). Criar os buckets uma vez:
  #   docker compose exec seaweedfs sh -c 'echo "s3.bucket.create -name documentos" | weed shell'
  #   docker compose exec seaweedfs sh -c 'echo "s3.bucket.create -name midia" | weed shell'
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -s3 -dir=/data -volume.max=0
    volumes:
      - seaweed_data:/data

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # 3306 já é usada pelo MySQL do XAMPP
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

volumes:
  db_data:
  seaweed_data:
