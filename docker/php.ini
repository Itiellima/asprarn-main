expose_php = Off
memory_limit = 256M

; Fotos de celular (o padrão é 2MB por arquivo e 8MB por requisição)
upload_max_filesize = 10M
post_max_size = 20M

; O código fica dentro da imagem e não muda com o container rodando
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600
