server {
    listen 80 default_server;
    server_name _;

    root /app/public;
    index index.php;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Permite uploads de fotos de celular (o padrão do nginx é 1MB)
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Arquivos do Vite têm hash no nome, podem ficar em cache por muito tempo
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # O fastcgi_params do Debian tira a porta do Host e quebra os redirects
        # no ambiente local (localhost:8080). Em produção só chega o domínio
        # configurado no proxy do Easypanel.
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
